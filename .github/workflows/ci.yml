name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build

      - name: Compile Python sources
        run: python -m compileall -q cli.py liver_failure_prognostic.py acute_liver_failure_agent tests

      - name: Run test suite
        run: pytest -v

      - name: Build distribution
        run: python -m build

      - name: Verify installed wheel and console scripts
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          cd /tmp
          acute-liver-failure-agent --help
          acute-liver-failure-engine --help
          acute-liver-failure-agent --evaluate --etiology acetaminophen --ph 7.25 --inr 6.8 --cr 3.5 --he-grade 3 --json > /tmp/alf.json
          python - <<'PY'
          import json
          with open("/tmp/alf.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["kings_college"]["criteria_met"] is True
          assert data["meld"]["estimated_30_day_mortality_pct"] is None
          PY

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Check for obvious committed secret files
        shell: bash
        run: |
          test ! -e .env
          test ! -e credentials.json
          test ! -e secrets.json
